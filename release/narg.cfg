; Fallout 2: Narg Edition settings.
;
; narg-install merges these keys into fallout2.cfg (the rest of fallout2.cfg is
; kept; the original is saved in backup/narg/). Change them afterwards in
; fallout2.cfg. Keys marked "auto" are set by the installer: the screen size
; is detected where possible.

[graphics]
; true-colour output at twice the logical resolution
hd=1
; every picture is upscaled 2x by the engine from your game's own art (and
; from any mod's, such as the Restoration Project's), with 16-bit colour;
; prepared while a map loads and kept in a disk cache
hd_upscale=scripted
hd_upscale_precision=16
hd_upscale_critters=1
; prepare each map's art while it loads, behind a loading screen
hd_upscale_preload=1
hd_loading_screen=1
; upscaled art is kept in data/hd/cache (at most hd_upscale_cache_mb), so a
; second visit to a town loads faster; hd_cache_mb is the memory cache
hd_upscale_cache=1
hd_upscale_cache_mb=2048
hd_cache_mb=512
; text drawn at 2x
hd_text=1
hd_text_style=sharp
; coloured light from fires, lamps and screens, glow, soft shadows
hd_lights=1
hd_lights_follow=1
; ranged attacks light their surroundings for a moment; explosions flash
hd_shot_light=1
; trees, bushes and grass sway in the wind
hd_wind=1
; the map glides when scrolling; mouse wheel / Ctrl+= / Ctrl+- zoom the map
smooth_scroll=1
zoom=1

[screen]
; HD needs scale=2 and a screen of at least 1280x960
scale=2
; auto: your display (macOS, Linux with xrandr, Windows), else 1920x1080
resolution_x=auto
resolution_y=auto

[ui]
; skip the three opening movies (the splash screen still shows)
skip_opening_movies=1
iface_bar_width=800
