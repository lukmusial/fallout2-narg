; Fallout 2: Narg Edition settings.
;
; narg-install merges these keys into fallout2.cfg (the rest of fallout2.cfg is
; kept; the original is saved in backup/narg/). Change them afterwards in
; fallout2.cfg. Keys marked "auto" are set by the installer: the screen size
; is detected where possible.

[graphics]
; true-colour output at twice the logical resolution, with HD art
hd=1
; HD art pack (mods/narg_hd.dat): mixed (AI art, scripted where the AI does
; poorly), ai, or scripted (needs mods/narg_hd_scripted.dat)
hd_pack=mixed
; only use an HD image while the game's own picture is the one it was made from
; (art replaced by a mod such as the Restoration Project keeps the mod's picture)
hd_verify=1
; text drawn at 2x
hd_text=1
hd_text_style=sharp
; coloured light from fires, lamps and screens, glow, soft shadows
hd_lights=1
hd_lights_follow=1
; desert, asphalt, pavement and grass vary from square to square
hd_ground_variants=1
; ranged attacks light their surroundings for a moment; explosions flash
hd_shot_light=1
; trees, bushes and grass sway in the wind
hd_wind=1
; the map glides when scrolling; mouse wheel / Ctrl+= / Ctrl+- zoom the map
smooth_scroll=1
zoom=1

[screen]
; HD needs scale=2 and a screen of at least 1280x960
scale=2
; auto: your display (macOS, Linux with xrandr, Windows), else 1920x1080
resolution_x=auto
resolution_y=auto

[ui]
; skip the three opening movies (the splash screen still shows)
skip_opening_movies=1
iface_bar_width=800
